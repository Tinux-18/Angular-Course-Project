<div class="row">
  <div class="col-xs-12">
    <form>
      <div class="row">
        <div class="col-sm-5 form-group">
          <label for="name">Name</label>
          <input
            type="text"
            name="name"
            id="name"
            class="form-control"
            #nameInput
          />
        </div>
        <div class="col-sm-2 form-group">
          <label for="amount">Amount</label
          ><input
            type="number"
            min="0"
            name="amount"
            id="amount"
            class="form-control"
            #amountInput
          />
        </div>
        <div class="col-sm-2 form-group">
          <label for="measurement">Measurement</label>
          <select
            name="measurement"
            id="measurement"
            class="form-control"
            #measurementInput
          >
            <option value="">Select measurement</option>
            <option *ngFor="let measure of measurements" [value]="measure">
              {{ measure }}
            </option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="col-xs-12">
          <button
            class="btn btn-success"
            type="submit"
            (click)="onAddIngredient(nameInput, amountInput, measurementInput)"
          >
            Add
          </button>
          <button
            class="btn btn-danger"
            type="button"
            (click)="onRemoveIngredient(nameInput)"
          >
            Delete
          </button>
          <button class="btn btn-primary" type="button" (click)="onRemoveAll()">
            Clear
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
