<div class="row">
  <div class="col-xs-10">
    <app-edit-shopping (updateIngredients)="onUpdate()"></app-edit-shopping>
    <hr />
    <ul class="list-group">
      <a
        class="list-group-item"
        style="cursor: pointer"
        *ngFor="let i of ingredients"
        >{{ i.name }} - {{ i.amount }}{{ i.measurement }}</a
      >
    </ul>
  </div>
</div>
<div class="row"></div>
